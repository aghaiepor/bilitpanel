version: "3.7"
services:
  sibpanel-v2:
    build:
      context: .
      dockerfile: ./dist/municipality/prod/Dockerfile_Municipality
    restart: always
    extra_hosts:
      - "bilit.tehran.iri:31.24.236.164"
    volumes:
      - ./sibpanel_v2:/var/www/
    ports:
      - 80:80
      - 443:443
networks:
   app_network:
      ipam:
         driver: default
         config:
           - subnet: 10.16.0.0/24
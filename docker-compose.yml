version: "3.3"
services:
  sibpanel-v2:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-http://archive.ubuntu.com/ubuntu}
    image: sibpanel-v2-local
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
   app_network:
      ipam:
         driver: default
         config:
           - subnet: 10.16.0.0/24

version: "3.7"
services:
  sib-panel-v2:
    build:
      args:
        user: mehdimj
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: sib-panel-v2
    container_name: sib-panel-v2
    restart: unless-stopped
    working_dir: /var/www/
    ports:
      - 8000:80
    volumes:
      - ./sibpanel_v2:/var/www
      - ./nginx.conf:/etc/nginx/site-avalibale/default
    env_file:
      - variables.env


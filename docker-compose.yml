version: "3.7"
services:
  sib-panel-v2-app:
    build:
      context: .
      #    image: sib-panel-v2
    container_name: sib-panel-v2
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./sibpanel_v2:/var/www/
    env_file:
      - variables.env
    networks:
      - app_network

  sib-panel-v2-nginx:
    build:
      context: ./nginx/.
    restart: unless-stopped
    ports:
      - 5009:80
      - 1012:443
    environment:
      NGINX_FPM_HOST: sib-panel-v2-app
      NGINX_ROOT: /var/www/public
    volumes:
      - ./sibpanel_v2/public:/var/www/public
      - ./nginx.conf:/etc/nginx/site-avalibale/default
      - ./ssls:/etc/ssl/
    depends_on:
      - sib-panel-v2-app
    networks:
      - app_network
    command: sed -i "s|# Gzip Settings|server_tokens off;|g" /etc/nginx/nginx.conf
networks:
  app_network:
    driver: bridge
